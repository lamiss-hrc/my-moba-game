<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Legends Web Edition | MOBA 2D</title>
    
    <!-- رمز وأيقونة اللعبة (Favicon) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%2300f0ff'/><path d='M30 70 L50 20 L70 70 L50 55 Z' fill='%23ff0055'/></svg>">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: #080911; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; color: #fff; }
        
        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { width: 100%; height: 100%; display: block; }

        /* شريط الواجهة العلوية */
        .top-bar {
            position: absolute; top: 15px; right: 20px; left: 20px;
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: none;
        }
        .stats-box {
            display: flex; gap: 15px; background: rgba(15, 20, 35, 0.85);
            padding: 8px 20px; border-radius: 20px; border: 1px solid #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); pointer-events: auto;
        }
        .stat-item { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 14px; }
        .gold { color: #ffd700; }
        .gems { color: #00f0ff; }

        .btn-shop {
            background: linear-gradient(45deg, #ff0055, #ff5500);
            border: none; color: white; padding: 8px 20px; border-radius: 20px;
            font-weight: bold; cursor: pointer; box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
            transition: 0.2s; pointer-events: auto;
        }
        .btn-shop:hover { transform: scale(1.05); }

        /* نافذة شحن المجوهرات والدفع */
        .modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px);
            justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background: #0f1423; border: 2px solid #00f0ff; width: 400px;
            padding: 25px; border-radius: 15px; text-align: center;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
        }
        .gem-card {
            background: #1a2238; border: 1px solid #2a3558; margin: 10px 0;
            padding: 12px; border-radius: 10px; display: flex; justify-content: space-between;
            align-items: center;
        }
        .btn-buy {
            background: #00f0ff; color: #000; border: none; padding: 6px 15px;
            border-radius: 5px; font-weight: bold; cursor: pointer;
        }

        /* أدوات التحكم السفلية */
        .controls-overlay {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 15, 30, 0.8); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 20px; border-radius: 25px; font-size: 13px; color: #aaa;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- الواجهة العلوية -->
        <div class="top-bar">
            <div class="stats-box">
                <div class="stat-item gold">🪙 <span id="gold-val">1250</span></div>
                <div class="stat-item gems">💎 <span id="gems-val">50</span></div>
            </div>
            <button class="btn-shop" onclick="toggleShop(true)">🛒 متجر الشحن (Gems)</button>
        </div>

        <canvas id="mobaCanvas"></canvas>

        <div class="controls-hint controls-overlay">
            التحكم: الأسهم / W A S D للتحرك | MOUSE LEFT للهجوم العادي | SPACE للمهارة الخارقة
        </div>

        <!-- نافذة الشحن والشراء -->
        <div class="modal" id="shopModal">
            <div class="modal-content">
                <h2 style="color: #00f0ff; margin-bottom: 15px;">💎 متجر مجوهرات MLBB</h2>
                <div class="gem-card">
                    <span>💎 250 مجوهرة</span>
                    <button class="btn-buy" onclick="buyGems(250, '$4.99')">$4.99</button>
                </div>
                <div class="gem-card">
                    <span>💎 1000 مجوهرة</span>
                    <button class="btn-buy" onclick="buyGems(1000, '$19.99')">$19.99</button>
                </div>
                <div class="gem-card">
                    <span>💎 5000 مجوهرة (عرض خاص)</span>
                    <button class="btn-buy" onclick="buyGems(5000, '$49.99')">$49.99</button>
                </div>
                <button style="margin-top: 15px; background: transparent; border: 1px solid #fff; color: #fff; padding: 5px 15px; border-radius: 5px; cursor: pointer;" onclick="toggleShop(false)">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mobaCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Player Stats & State
        let gems = 50;
        let gold = 1250;

        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 20,
            color: '#00f0ff',
            speed: 5,
            hp: 100,
            maxHp: 100
        };

        const keys = {};
        const bullets = [];
        const particles = [];

        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        // Shooting
        window.addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            const angle = Math.atan2(e.clientY - player.y, e.clientX - player.x);
            bullets.push({
                x: player.x,
                y: player.y,
                dx: Math.cos(angle) * 12,
                dy: Math.sin(angle) * 12,
                radius: 6,
                color: '#ff0055'
            });
        });

        // Shop Modal Functions
        function toggleShop(show) {
            document.getElementById('shopModal').style.display = show ? 'flex' : 'none';
        }

        function buyGems(amount, price) {
            alert(`جاري توجيهك إلى بوابة الدفع الآمنة لخصم ${price}...`);
            gems += amount;
            document.getElementById('gems-val').innerText = gems;
            toggleShop(false);
        }

        // Game Loop
        function update() {
            // Player Movement
            if ((keys['w'] || keys['arrowup']) && player.y > player.radius) player.y -= player.speed;
            if ((keys['s'] || keys['arrowdown']) && player.y < canvas.height - player.radius) player.y += player.speed;
            if ((keys['a'] || keys['arrowleft']) && player.x > player.radius) player.x -= player.speed;
            if ((keys['d'] || keys['arrowright']) && player.x < canvas.width - player.radius) player.x += player.speed;

            // Ultimate Ability
            if (keys[' ']) {
                for (let i = 0; i < 20; i++) {
                    const angle = (Math.PI * 2 / 20) * i;
                    bullets.push({
                        x: player.x,
                        y: player.y,
                        dx: Math.cos(angle) * 8,
                        dy: Math.sin(angle) * 8,
                        radius: 5,
                        color: '#ffd700'
                    });
                }
                keys[' '] = false;
            }

            // Update Bullets
            bullets.forEach((b, index) => {
                b.x += b.dx;
                b.y += b.dy;
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(index, 1);
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Grid Arena Background
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.05)';
            ctx.lineWidth = 1;
            const gridSize = 50;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Draw Bullets with Glow
            bullets.forEach(b => {
                ctx.shadowBlur = 10;
                ctx.shadowColor = b.color;
                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Player with Glow
            ctx.shadowBlur = 20;
            ctx.shadowColor = player.color;
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Health Bar
            ctx.fillStyle = 'rgba(255, 0, 0, 0.7)';
            ctx.fillRect(player.x - 25, player.y - 35, 50, 6);
            ctx.fillStyle = '#00ff66';
            ctx.fillRect(player.x - 25, player.y - 35, (player.hp / player.maxHp) * 50, 6);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
